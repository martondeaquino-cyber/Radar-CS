name: Gerar instaladores
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'radar-cs-desktop/main.js'
      - 'radar-cs-desktop/updater.js'
      - 'radar-cs-desktop/package.json'
      - 'radar-cs-desktop/build/**'
permissions:
  contents: write
defaults:
  run:
    working-directory: radar-cs-desktop
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm pkg set version=0.2.${{ github.run_number }}
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Radar CS 0.2.${{ github.run_number }}
          files: |
            radar-cs-desktop/dist/*.exe
            radar-cs-desktop/dist/*.exe.blockmap
            radar-cs-desktop/dist/latest.yml
            radar-cs-desktop/dist/*.dmg
