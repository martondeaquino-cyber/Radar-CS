function an(){const tx=$('#tx').value,cl=C.find(c=>tx.includes(c.n))?.id||1;S.cv=tx.split(/[.\n]+/).map(s=>s.trim()).filter(s=>s.length>8).map((s,i)=>{let tp=/prometeu|vai enviar|vou enviar|enviaremos|prometi/i.test(s)?'Promessa':/decid|aprov|fechou|definido/i.test(s)?'Decisão':/pendente|falta|aguardando|depende/i.test(s)?'Pendência':/voltar a falar|ligar|retornar|próximo contato/i.test(s)?'Próximo contato':null;return tp&&{id:i,tp,t:s,r:(s.match(/Marina|Rafael|Bianca/)||['Você'])[0],pz:(s.match(/hoje|amanhã|sexta|segunda|quarta|quinta|terça|\d{1,2}\/\d{1,2}/i)||['—'])[0],c:cl,st:'novo'}}).filter(Boolean);toast(S.cv.length?S.cv.length+' itens identificados (simulado)':'Nada identificado. Tente incluir decisões, prazos ou promessas.');$('#cv').innerHTML=cvh()}
function cvh(){return S.cv.map(x=>`<div class="card" style="margin-bottom:10px;${x.st=='descartado'?'opacity:.45':''}"><div class="fl" style="margin:0 0 8px"><select onchange="S.cv[${S.cv.indexOf(x)}].tp=this.value">${['Decisão','Pendência','Promessa','Próximo contato'].map(o=>`<option ${o==x.tp?'selected':''}>${o}</option>`).join('')}</select><select onchange="S.cv[${S.cv.indexOf(x)}].c=this.value">${C.map(c=>`<option value="${c.id}" ${c.id==x.c?'selected':''}>${c.n}</option>`).join('')}</select>${bd(x.st,{novo:'ac',aprovado:'ok',descartado:'mt',enviado:'ok'}[x.st])}</div><input type="text" style="width:100%;margin-bottom:8px" value="${x.t.replace(/"/g,'&quot;')}" oninput="S.cv[${S.cv.indexOf(x)}].t=this.value"><div class="fl"><select onchange="S.cv[${S.cv.indexOf(x)}].r=this.value">${P.map(p=>`<option ${p==x.r?'selected':''}>${p}</option>`).join('')}</select><input type="text" style="width:130px" value="${x.pz}" oninput="S.cv[${S.cv.indexOf(x)}].pz=this.value"></div><button class="btn s" onclick="cvs(${S.cv.indexOf(x)},'aprovado')">Aprovar</button> <button class="btn s" onclick="cvs(${S.cv.indexOf(x)},'descartado')">Descartar</button> <button class="btn p s" onclick="cvs(${S.cv.indexOf(x)},'enviado')">Simular envio ao Asana</button></div>`).join('')}
function cvs(i,st){const x=S.cv[i];x.st=st;if(st=='enviado'){T.push({id:Date.now(),t:x.t,c:x.c,u:1,o:x.r,d:3,col:'prox'});award(10);toast('Enviado ao Asana (simulado) · tarefa criada na demonstração')}else toast(st=='aprovado'?'Item aprovado':'Item descartado');$('#cv').innerHTML=cvh()}
const COLS=[['agora','Fazer agora'],['hoje','Fazer hoje'],['prox','Próximos dias'],['aguard','Aguardando retorno'],['atraso','Em atraso']];
V.pessoal=()=>`<h1>Meu painel</h1><p class="sub">Visão consolidada. Não substitui o Asana: apenas organiza o que pede sua atenção.</p><div class="fl">${sel('pf','Todos os clientes',cOpts(),S.pf).replace(/S\.f\.pf/,'S.pf')}<small style="align-self:center">Concluídas: ${T.filter(t=>t.col=='done').length}</small></div><div class="kb">${COLS.map(([k,l])=>`<div class="kc"><h3>${l} · ${T.filter(t=>t.col==k&&(!S.pf||t.c==S.pf)).length}</h3>${T.filter(t=>t.col==k&&(!S.pf||t.c==S.pf)).map(t=>`<div class="card"><b>${t.t}</b><small>${cn(t.c)} · ${t.o}</small><div style="margin:8px 0">${bd(UR[t.u],UC[t.u])}</div><select onchange="mv(${t.id},this.value)">${COLS.map(([a,b])=>`<option value="${a}" ${a==k?'selected':''}>${b}</option>`).join('')}</select> <button class="btn s" onclick="fin(${t.id})">✓</button></div>`).join('')}</div>`).join('')}</div>`;
function dh(d){const s=stOf(d),L=SL[s],pc=d.done?100:Math.min(100,Math.max(0,(Date.now()-d.start)/(d.due-d.start)*100));
return`<div class="card"><div class="row" style="border:0;padding-top:0"><b>${d.n}</b>${bd(L[0],L[1])}</div><small>${d.sq} · ${d.p} · cliente: ${cn(d.c)}</small><div style="margin:12px 0"><div class="cd" data-i="${d.id}">${d.done?'Entregue':fmt(d.due-Date.now())}</div><small>${d.done?'':d.due<Date.now()?'em atraso':'até o prazo'}</small></div><div class="bar ${s}"><i style="width:${pc}%"></i></div><p style="margin:10px 0 4px"><b>Impacto:</b> ${d.imp}</p><small>Histórico de cobranças: ${d.cob.join(' | ')||'nenhuma'}</small>${d.done?'':`<p style="margin:8px 0"><b>Próxima ação:</b> ${d.a}</p><div class="fl" style="margin:0"><button class="btn s" onclick="dact(${d.id},'c')">Registrar cobrança</button><button class="btn s" onclick="dact(${d.id},'a')">Simular alerta</button><button class="btn s" onclick="dact(${d.id},'u')">Solicitar atualização</button><button class="btn p s" onclick="dact(${d.id},'f')">Concluir</button></div>`}${s=='prox'?`<p>${bd('Acompanhe de perto','wn')}</p>`:''}</div>`}
V.entregas=()=>`<h1>Radar de entregas de outras squads</h1><p class="sub">Dependências que afetam seus clientes. Atrasos geram um alerta simulado no Discord.</p><div class="g g2">${[...D].sort(DSORT).map(dh).join('')}</div>`;
V.prep=()=>{const c=C.find(x=>x.id==S.prep);return`<h1>Preparador de reuniões</h1><p class="sub">Selecione um cliente e gere o roteiro (simulado).</p><div class="fl">${sel('pf','Escolha o cliente',cOpts(),S.prep).replace('S.f.pf=this.value','S.prep=this.value;S.prepOk=0')}<button class="btn p" onclick="if(!S.prep)return toast('Escolha um cliente');S.prepOk=1;R();toast('Roteiro gerado (simulado)')">Preparar reunião</button></div>${c&&S.prepOk?`<div class="g g2"><div class="card"><h2>${c.n}</h2><p>Último contato: há ${c.last} dias · ${rk(c.risk)}</p><small>Resultados recentes</small><p>${c.res}</p><small>Pendências e promessas</small>${[...c.pend,...PR.filter(p=>p.c==c.id&&p.st!='cumprida').map(p=>p.t)].map(x=>`<p style="margin:2px 0">• ${x}</p>`).join('')||'<p class="mu">Nenhuma.</p>'}</div><div class="card"><h2>Riscos e oportunidades</h2><p>${c.sig?bd('Risco','bad')+' '+c.sig:bd('Sem riscos relevantes','ok')}</p><p>${bd('Oportunidade','ac')} ${c.opp}</p><h2 style="margin-top:14px">Perguntas importantes</h2><p style="margin:2px 0">1. O que mudou nas prioridades do negócio?</p><p style="margin:2px 0">2. ${c.pend[0]?'Como podemos destravar: '+c.pend[0]+'?':'Qual é a meta do próximo mês?'}</p><p style="margin:2px 0">3. Os resultados atuais atendem à sua expectativa?</p><button class="btn p s" style="margin-top:10px" onclick="award(8,'fu')">Marcar como preparada</button></div></div>`:'<div class="card mu">Escolha um cliente para ver o roteiro.</div>'}`};
V.discord=()=>`<h1>Central de alertas — Discord</h1><p class="sub">Mensagens curtas, sem informações confidenciais. Nada é enviado de verdade.</p><div class="fl"><select id="at"><option>Entrega</option><option>Cliente</option><option>Tarefa</option><option>Reunião</option></select><button class="btn p" onclick="sa()">Simular envio de notificação</button></div><div id="al">${alh()}</div>`;
const alh=()=>A.map(a=>`<div class="dc"><b>#alertas-cs</b> · ${a.h} ${bd(a.pr,a.pr=='Alta'?'bad':'wn')} ${bd(a.tp,'mt')}<br>${a.m}<br><span style="opacity:.7">Ação sugerida: ${a.a}</span></div>`).join('');
function sa(){const t=$('#at').value,m={Entrega:['Entrega atrasada: Pack de criativos','Cobrar a squad'],Cliente:['Cliente sem contato há 12 dias','Registrar contato'],Tarefa:['Tarefa vence hoje','Concluir ou reagendar'],Reunião:['Reunião em 1h','Abrir preparador']}[t];A.unshift({h:tm(),tp:t,m:m[0],pr:'Média',a:m[1]});$('#al').innerHTML=alh();toast('✓ Notificação enviada (simulada, apenas na demo)')}
const IN=[['Asana','Tarefas, responsáveis, prazos e status','Em simulação','ok',150,60],['Google Calendar','Reuniões e compromissos','Em simulação','ok',450,60],['Fathom','Resumos e decisões de reuniões','Aguardando configuração','wn',60,180],['Google Drive','Documentos e links','Não conectado','mt',540,180],['Claude','Interpreta, organiza contexto e recomenda','Em simulação','ok',150,300],['Discord','Notificações curtas e sem dados sensíveis','Em simulação','ok',450,300]];
V.integ=()=>`<h1>Integrações</h1><p class="sub">Como o sistema se conectaria às ferramentas. Nenhuma conta real é conectada.</p><div class="card"><svg class="sv" viewBox="0 0 600 360">${IN.map(i=>`<line x1="300" y1="180" x2="${i[4]}" y2="${i[5]+22}" stroke="${i[3]=='ok'?'#3a4fd7':'#c9ccd4'}" stroke-width="2" ${i[3]=='ok'?'':'stroke-dasharray="5 5"'}><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.5s" repeatCount="indefinite"/></line>`).join('')}<circle cx="300" cy="180" r="46" fill="#3a4fd7"/><text x="300" y="177" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Sistema CS</text><text x="300" y="194" text-anchor="middle" fill="#fff" font-size="11">Lumos</text>${IN.map((i,k)=>`<g onclick="ig(${k})"><rect x="${i[4]-70}" y="${i[5]}" width="140" height="44" rx="10" fill="#fff" stroke="#e5e7e2"/><text x="${i[4]}" y="${i[5]+19}" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2230">${i[0]}</text><text x="${i[4]}" y="${i[5]+35}" text-anchor="middle" font-size="10" fill="${{ok:'#1f8a5b',wn:'#b7791f',mt:'#6b7385'}[i[3]]}">${i[2]}</text></g>`).join('')}</svg><small>Clique em uma ferramenta para ver o que ela faria.</small></div>`;
function ig(k){const i=IN[k];md(`<h2>${i[0]}</h2><p>${i[1]}.</p><p>${bd(i[2],i[3])}</p><p class="mu">Nesta etapa nada é conectado: não pedimos senhas, tokens nem acesso a arquivos.</p><button class="btn p" onclick="toast('Sincronização simulada com ${i[0]}');cm()">Simular sincronização</button> <button class="btn" onclick="cm()">Fechar</button>`)}
function R(){$('#side').innerHTML=`<div class="logo"><i></i>Lumos CS</div>${NAV.map(n=>`<button class="nv ${S.v==n[0]?'on':''}" onclick="go('${n[0]}')"><b>${n[2]}</b>${n[1]}</button>`).join('')}<div class="gw"><label><input type="checkbox" ${S.gam?'checked':''} onchange="S.gam=this.checked;R()"> Gamificação</label>${S.gam?`<div class="bar" style="margin:8px 0 4px"><i style="width:${LVP(S.pts)}%"></i></div><small>${S.pts} pts · ilustrativo</small>`:''}</div>`;
$('#main').innerHTML=`<div class="demo">Modo de demonstração — nenhuma ação é executada em sistemas reais</div>`+V[S.v]()}
function go(v){S.v=v;if(v=='clientes')S.cl=null;R();scrollTo(0,0)}function oc(id){S.cl=id;S.tab=0;S.v='clientes';R();scrollTo(0,0)}
function fin(id){const t=T.find(x=>x.id==id);t.col='done';award(10,'fu');R()}function mv(id,c){T.find(x=>x.id==id).col=c;toast('Prioridade alterada');R()}
function logc(id,q){const c=C.find(x=>x.id==id);c.last=0;c.tl.unshift(['hoje','Contato registrado (simulado)']);if(c.risk)c.risk--;award(12,'fu');if(q)toast('Ação registrada para '+c.n);R()}
function prm(i){PR[i].st='cumprida';PR[i].d='Concluída';award(10,'pr');R()}
function dact(id,a){const d=D.find(x=>x.id==id);if(a=='c'){d.cob.unshift('Hoje '+tm()+' · Cobrança registrada');award(5,'en')}if(a=='u'){d.cob.unshift('Hoje '+tm()+' · Atualização solicitada');toast('Atualização solicitada (simulado)')}if(a=='a')push(d);if(a=='f'){d.done=1;award(15,'en')}R()}

let TH='light';function tg(){TH=TH=='light'?'dark':'light';document.documentElement.dataset.theme=TH}
IN[0][0]='Asana';IN.push(['Instagram','Contagem pública de seguidores','Em simulação','ok',300,310]);
const LV=['Iniciante','Observador','Estrategista','Guardião de Clientes','Mestre do CS','Lenda da Lumos'],lvt=p=>LV[Math.min(5,LVI(p))];
const MS=[5000,10000,15000,20000,25000,30000,50000],nx=v=>MS.find(m=>m>v)||v*2,kk=m=>m>=1000?m/1000+' mil':m;

const G2=[{t:'Registrar 3 contatos',cur:()=>S.cnt.fu,tgt:3,xp:30},{t:'Cumprir 2 promessas',cur:()=>S.cnt.pr,tgt:2,xp:30},{t:'Monitorar 3 entregas',cur:()=>S.cnt.en,tgt:3,xp:40},{t:'Chegar a 250 XP',cur:()=>S.pts,tgt:250,xp:50}];
function conf(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const cs=['#3a4fd7','#f0b955','#1f8a5b','#ff7a63','#c084fc'],p=Array.from({length:160},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*18,vy:-Math.random()*17-4,r:Math.random()*6+3,c:cs[Math.random()*5|0],a:Math.random()*6}));let f=0;(function l(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.35;q.a+=.2;x.fillStyle=q.c;x.save();x.translate(q.x,q.y);x.rotate(q.a);x.fillRect(-q.r,-q.r/2,q.r*2,q.r);x.restore()});if(++f<180)requestAnimationFrame(l);else x.clearRect(0,0,c.width,c.height)})()}
function cel(t){$('#lp').innerHTML=t;$('#lv').classList.add('on');const h=$('#lv h1');h.style.animation='none';h.offsetWidth;h.style.animation='';conf();clearTimeout(cel.t);cel.t=setTimeout(()=>$('#lv').classList.remove('on'),4800)}
function chk(){C.forEach(c=>{const g=IG[c.id],v=g.h.at(-1);if(v>=g.tg){const m=g.tg;g.tg=nx(v);S.pts+=50;cel(`${c.n} chegou a ${m.toLocaleString('pt-BR')} seguidores!<br>Meta atingida`)}});G2.forEach(g=>{if(!g.ok&&g.cur()>=g.tgt){g.ok=1;S.pts+=g.xp;cel(`Meta concluída: ${g.t}<br>+${g.xp} XP`)}})}
function award(n,k){const o=LVI(S.pts);if(k)S.cnt[k]++;S.pts+=n;for(const x in AC)if(!S.ach[x]&&S.cnt[x]>=AC[x][1]){S.ach[x]=1;setTimeout(()=>toast('Meta atingida: '+AC[x][0]),900)}chk();if(S.gam&&(LVI(S.pts))>o)setTimeout(()=>cel(`Nível ${(LVI(S.pts))+1} · ${lvt(S.pts)}`),500)}
function igChk(q){C.forEach(c=>{const v=IG[c.id].h.at(-1),m=nx(v),key=c.id+'-'+m;if(v>=.95*m&&!S.igA[key]){S.igA[key]=1;A.unshift({h:tm(),tp:'Cliente',m:`${c.n} está a ${Math.round(v/m*100)}% de ${kk(m)} seguidores`,pr:'Média',a:'Arte de agradecimento criada no Asana'});T.push({id:Date.now()+c.id,t:'Criar arte de agradecimento: '+kk(m)+' seguidores',c:c.id,u:1,o:'Marina',d:3,col:'prox'});if(!q)toast(`🔔 ${c.n} perto de ${kk(m)}! Tarefa criada no Asana (simulada)`)}})}
function wk(){S.wk++;C.forEach(c=>{const h=IG[c.id].h,n=h.length,a=(h[n-1]-h[n-4])/3;h.push(Math.round(h[n-1]+a*(1+Math.random()*.7)+Math.random()*30-10));if(h.length>10)h.shift()});igChk();R();chk()}
function stg(id,v){const n=parseInt(String(v).replace(/\D/g,''));if(n>0){IG[id].tg=n;toast('Meta atualizada');R();chk()}}
function gm(){const lv=LVI(S.pts);return`<div class="card" style="margin-bottom:14px"><div class="g g3"><div><small>Nível ${lv+1}</small><div class="stat" style="font-size:22px">${lvt(S.pts)}</div><div class="bar" style="margin:8px 0 4px"><i style="width:${LVP(S.pts)}%"></i></div><small>faltam ${LVN(S.pts)} XP para o próximo nível</small></div><div><div class="stat" style="font-size:24px"><span class="fl2">🔥</span> ${4+S.cnt.fu} dias</div><small>sequência com prioritários em dia</small><small>Consistência dos follow-ups: ${Math.min(100,70+S.cnt.fu*6+S.cnt.pr*4)}%</small></div><div><small>Missões</small>${G2.slice(0,3).map(g=>`<div style="margin:5px 0"><small style="display:flex;justify-content:space-between"><span>${g.t}</span><span>${Math.min(g.cur(),g.tgt)}/${g.tgt}</span></small><div class="bar ${g.ok?'ok':''}"><i style="width:${Math.min(100,g.cur()/g.tgt*100)}%"></i></div></div>`).join('')}<button class="btn s" onclick="go('metas')">Ver metas</button></div></div></div>`}
const SQ=['Produção de vídeos','Tráfego pago','Design','Desenvolvimento','Conteúdo','Dados'];

const mood0=mood;mood=function(){const m=mood0();m.sc=Math.min(100,m.sc+(S.love||0));m.k=m.sc<30?'mad':m.sc<55?'sad':'ok';return m};
function gpc(){const r=[...MG,...G2].map(g=>Math.min(1,(typeof g.cur=='function'?g.cur():g.cur)/g.tgt));C.forEach(c=>r.push(Math.min(1,IG[c.id].h.at(-1)/IG[c.id].tg)));r.push(sgp());return Math.round(r.reduce((a,b)=>a+b,0)/r.length*100)}
function jvh(i){const lv=pi(),pc=i<=lv?100:Math.min(100,Math.round(S.pts/XT[i]*100)),w=i==lv?(lv>=5?100:LVP(S.pts)):pc,tx=i==lv?(lv>=5?'Nível máximo atingido':(LVP(S.pts))+'% do caminho até '+LV[lv+1]):i<lv?'Etapa concluída · '+XT[i]+' XP':'Faltam '+Math.max(0,XT[i]-S.pts)+' XP ('+pc+'% do caminho)';return`<b>${LV[i]}</b> ${bd(i<lv?'Conquistado':i==lv?'Nível atual':'Bloqueado',i<lv?'ok':i==lv?'ac':'mt')}<p style='margin:6px 0'>${LD[i]}</p><small>Ritmo padrão: ${i?LT[i]:'início da jornada'}</small><div class='bar ${i<lv?'ok':''}' style='margin:6px 0'><i style='width:${w}%'></i></div><small>${tx} · Metas concluídas: ${gpc()}%</small>`}

function happy(k){if(!S.snd||!S.vol)return;if(k=='mad'){tone(150,0,.22,'sawtooth',.06);tone(200,.18,.2,'sawtooth',.05)}else if(k=='sad'){tone(660,0,.12,'sine',.1);tone(784,.1,.22,'sine',.1)}else{tone(784,0,.09,'triangle',.14);tone(988,.08,.09,'triangle',.14);tone(1319,.16,.2,'triangle',.12)}}
function heart(){const s=$('#sg'),p=$('#pt');if(!s||!p)return;const e=document.createElement('span');e.className='ht';e.textContent=['❤','💜','✨'][Math.random()*3|0];e.style.left=(p.offsetLeft+20+Math.random()*90)+'px';s.appendChild(e);setTimeout(()=>e.remove(),1200)}
function updm(){const m=mood(),p=$('#pt'),b=$('#hb');if(p){p.classList.remove('ok','sad','mad');p.classList.add(m.k)}if(b)b.style.width=m.sc+'%';const em=$('#pt .em');if(em)em.textContent={ok:'😊',sad:'😢',mad:'😠'}[m.k]}
let patT=0,patOn=0;
function pat(on){const p=$('#pt');if(!p)return;patOn=on;if(on){p.style.setProperty('--hold',p.offsetLeft+'px');patT=Date.now();happy(mood().k);S.love=Math.min(15,(S.love||0)+1);updm()}p.classList.toggle('pat',!!on)}
function ptm(){const t=Date.now();if(t-(ptm.h||0)>220){ptm.h=t;heart()}if(t-patT>1500){patT=t;happy(mood().k);S.love=Math.min(15,(S.love||0)+1);updm()}}
function pclick(){const m=mood(),a=tips(m),b=$('#sb');if(b)b.textContent=a[Math.random()*a.length|0];happy(m.k);heart();heart();const p=$('#pt');if(p){p.classList.add('pose');setTimeout(()=>p.classList.remove('pose'),1300)}}

const pbh=m=>{const hp=Math.max(0,Math.round(S.hp));return`<small id='pT1'>Felicidade ${m.sc}%</small><div class='bar ${m.k=='ok'?'ok':m.k=='sad'?'wn':'bad'}' id='pB1'><i id='pF1' style='width:${m.sc}%'></i></div><small id='pT2'>Vida ${hp}/100 · dano ${100-hp}%</small><div class='bar hp'><i id='pF2' style='width:${hp}%'></i></div>`};
function updm(){const m=mood(),p=$('#pp');if(!p)return;p.classList.remove('ok','sad','mad');p.classList.add(m.k);p.classList.toggle('faint',S.hp<=0);const hp=Math.max(0,Math.round(S.hp));$('#pT1').textContent='Felicidade '+m.sc+'%';$('#pF1').style.width=m.sc+'%';$('#pB1').className='bar '+(m.k=='ok'?'ok':m.k=='sad'?'wn':'bad');$('#pT2').textContent='Vida '+hp+'/100 · dano '+(100-hp)+'%';$('#pF2').style.width=hp+'%'}
function heart(){const s=$('#sg'),p=$('#pp');if(!s||!p)return;const e=document.createElement('span');e.className='ht';e.textContent=['❤','💜','✨'][Math.random()*3|0];e.style.left=(p.offsetLeft+20+Math.random()*90)+'px';s.appendChild(e);setTimeout(()=>e.remove(),1200)}
function pat(on){const p=$('#pp');if(!p)return;patOn=on;if(on){p.style.transition='none';p.style.setProperty('--hold',p.offsetLeft+'px');p.classList.remove('walk');patT=Date.now();happy(mood().k);S.love=Math.min(15,(S.love||0)+1);updm()}else{p.style.left=p.style.getPropertyValue('--hold')||p.style.left}p.classList.toggle('pat',!!on)}
function pclick(){const m=mood(),a=tips(m),b=$('#sb'),p=$('#pp');if(b)b.textContent=a[Math.random()*a.length|0];happy(m.k);heart();heart();if(p){p.classList.add('pose');setTimeout(()=>p.classList.remove('pose'),800)}}
function walk(){const p=$('#pp'),s=$('#sg');if(p&&s&&!patOn&&S.hp>0){const w=s.clientWidth-p.offsetWidth-10,c=p.offsetLeft,x=Math.max(5,Math.random()*w),t=Math.max(.8,Math.abs(x-c)/70);p.style.setProperty('--d',x<c?-1:1);p.style.transition='left '+t+'s linear';p.classList.add('walk');p.style.left=x+'px';setTimeout(()=>p.classList.remove('walk'),t*1000)}setTimeout(walk,3000+Math.random()*3000)}
setTimeout(walk,1500);
function tickHp(){const m=mood(),idle=(Date.now()-S.lastOk)/1000;S.tk=(S.tk||0)+1;let d=0;if(m.k!='ok'&&idle>45){if(S.tk%5==0){d=m.k=='mad'?2:1;S.hp=Math.max(0,S.hp-d)}}else if(m.k=='ok'&&S.tk%8==0)S.hp=Math.min(100,S.hp+1);if(d){const b=$('#sb');if(b)b.textContent=S.hp<=0?'Preciso de cuidados! Conclua uma meta.':'Ai! Estou perdendo vida... faça uma meta!'}}
setInterval(()=>{tickHp();updm()},1000);
const aw1=award;award=function(n,k){S.lastOk=Date.now();S.hp=Math.min(100,S.hp+6);aw1(n,k)};
const c2_=cel;cel=function(t){S.lastOk=Date.now();S.hp=Math.min(100,S.hp+12);c2_(t)};
const vh=V.home;V.home=()=>{const m=mood();return vh().replace(/<div class='stg' id='sg'>[\s\S]*?<\/div><\/div><small>Humor[\s\S]*?id='hb'[^>]*><\/i><\/div>/,()=>`<div class='stg' id='sg'><div id='sb' class='sb'>${tips(m)[0]}</div><div id='pp' class='pet ${m.k}${S.hp<=0?' faint':''}' style='left:40%' onclick='pclick()' onmouseenter='pat(1)' onmouseleave='pat(0)' onmousemove='ptm()'><div id='pbars' class='pbars'>${pbh(m)}</div><div class='pf'><div class='b3'><img src='${PETI[pi()]}'></div></div><div class='sh'></div></div></div><small>Passe o mouse para fazer carinho e clique para ele reagir. Sem atingir metas por muito tempo, ele perde vida.</small>`)};
function hsc(c){const w=PR.filter(p=>p.c==c.id),ou=w.filter(p=>p.st=='atrasada').length,ab=w.filter(p=>p.st=='aberta').length,dl=D.filter(d=>d.c==c.id&&['atr','crit'].includes(stOf(d))).length,h=IG[c.id].h,gr=(h.at(-1)-h[0])/h[0]*100;const f=[['Engajamento',c.eng],['Frequência de contato',Math.max(0,Math.round(100-c.last*4.5))],['Promessas',Math.max(0,100-ou*35-ab*8)],['Entregas das squads',Math.max(0,100-dl*35)],['Crescimento no Instagram',Math.max(0,Math.min(100,Math.round(55+gr*4)))]],wt=[.3,.25,.2,.1,.15];return{sc:Math.round(f.reduce((s,x,i)=>s+x[1]*wt[i],0)),f,wt}}
const hst=s=>s>=70?['Saudável','ok']:s>=50?['Neutro','wn']:['Em risco','bad'];
function hhist(c){const sc=hsc(c).sc,d=Math.round((sc-60)/6);return Array.from({length:8},(_,i)=>i==7?sc:Math.max(0,Math.min(100,sc-Math.round(d*(7-i)/7)+((c.id*(i+3))%5-2))))}
function hsh(id){const c=C.find(x=>x.id==id),h=hhist(c),X=i=>30+i*60,Y=v=>110-v*.9;md(`<h2>Histórico do Health Score</h2><p class='mu'>${c.n} · últimas 8 semanas (dados de demonstração)</p><svg viewBox='0 0 480 140' class='sv ch'><line x1='30' x2='450' y1='${Y(70)}' y2='${Y(70)}' style='stroke:var(--ok)' stroke-dasharray='4 4'/><text x='452' y='${Y(70)+4}' font-size='10' style='fill:var(--ok)'>70</text><polyline pathLength='1' fill='none' style='stroke:var(--ac)' stroke-width='2.5' points='${h.map((v,i)=>X(i)+','+Y(v)).join(' ')}'/>${h.map((v,i)=>`<circle cx='${X(i)}' cy='${Y(v)}' r='4' style='fill:var(--ac)'><title>S${i-7||'0'}: ${v}</title></circle><text x='${X(i)}' y='${Y(v)-9}' text-anchor='middle' font-size='10' style='fill:var(--ink)'>${v}</text>`).join('')}</svg><button class='btn' onclick='cm()'>Fechar</button>`)}
function hsCard(c){const{sc,f,wt}=hsc(c),st=hst(sc),dl=Math.round((sc-60)/6),imp=f.map((x,i)=>[x[0],(x[1]-60)*wt[i]]).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))[0],K=2*Math.PI*50;return`<div class='card' style='margin:14px 0'><div style='display:flex;gap:22px;flex-wrap:wrap;align-items:center'><svg width='130' height='130' viewBox='0 0 120 120'><circle cx='60' cy='60' r='50' fill='none' style='stroke:var(--ln)' stroke-width='10'/><circle class='rg' cx='60' cy='60' r='50' fill='none' style='stroke:var(--${st[1]})' stroke-width='10' stroke-linecap='round' stroke-dasharray='${K*sc/100} ${K}' transform='rotate(-90 60 60)'/><text x='60' y='68' text-anchor='middle' font-size='30' font-weight='800' style='fill:var(--ink)'>${sc}</text></svg><div style='flex:1;min-width:200px'><h2>Health Score</h2>${bd(st[0],st[1])} <span class='mu'>Score geral de saúde</span><p style='margin:10px 0 2px'><b>Últimos 30 dias</b> ${dl>=0?'▲':'▼'} ${Math.abs(dl)}</p><small>Mudança recente: ${imp[1]>=0?'+':''}${Math.round(imp[1])} ${imp[0]}</small><div class='fl' style='margin:10px 0 0'><button class='btn s' onclick='hsh(${c.id})'>Ver histórico do score</button></div></div><div style='flex:1.4;min-width:240px'>${f.map((x,i)=>`<div style='margin:6px 0'><small style='display:flex;justify-content:space-between'><span>${x[0]} · peso ${Math.round(wt[i]*100)}%</span><span>${x[1]}</span></small><div class='bar ${x[1]>=70?'ok':x[1]>=50?'wn':'bad'}'><i style='width:${x[1]}%'></i></div></div>`).join('')}</div></div></div>`}
function clist(){const q=S.q.toLowerCase();return`<table style='width:100%;border-collapse:collapse'>${C.filter(c=>(!S.radar||c.last>=10)&&c.n.toLowerCase().includes(q)).map(c=>{const h=hsc(c).sc,st=hst(h);return`<tr class='row c' style='display:flex' onclick='oc(${c.id})'><td style='flex:2'><b>${c.n}</b><small>${c.s} · demo</small></td><td style='flex:1' class='mu'>há ${c.last}d</td><td style='flex:1' class='mu'>${c.next}</td><td style='flex:1'>${bd(st[0]+' · '+h,st[1])}</td><td style='flex:1'><div class='bar'><i style='width:${c.eng}%'></i></div><small>${c.eng}% engaj.</small></td></tr>`}).join('')||'<p class=mu>Nenhum cliente encontrado.</p>'}</table>`}
const vc3=V.clientes;V.clientes=()=>{const h=vc3();return S.cl?h.replace('<div class="tabs">',()=>hsCard(C.find(c=>c.id==S.cl))+'<div class="tabs">'):h};

/* ---------- entender o pedido (simulado por palavras-chave) ---------- */
function gtParse(tx,tool0){const n=tx.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''),d={tool:tool0||'',freq:'manual',dia:1,wd:1,hora:'09:00',data:'',alvo:'',msg:'',nome:'',tx};
 if(!d.tool){d.tool=/whatsapp|zap\b/.test(n)?'whatsapp':/asana/.test(n)?'asana':/\bdrive\b/.test(n)?'drive':/discord/.test(n)?'discord':/fathom/.test(n)?'fathom':/instagram|insta\b/.test(n)?'instagram':/google calendar|calendario|agenda/.test(n)?'gcal':/grupo|mensagem/.test(n)?'whatsapp':/tarefa|demanda/.test(n)?'asana':/reuniao|evento|marcar/.test(n)?'gcal':/pasta|arquivo|\batas?\b/.test(n)?'drive':/transcri/.test(n)?'fathom':/seguidores/.test(n)?'instagram':/aviso|alerta|avise/.test(n)?'discord':''}
 let m;const hoje=new Date();
 if((m=n.match(/ultimo dia (?:util )?do mes/))){d.freq='mensal';d.dia=31}
 else if((m=n.match(/(?:todo dia|dia) (\d{1,2}) (?:de )?(?:cada|todo) mes/))||(m=n.match(/todo dia (\d{1,2})\b(?!\s*[\/h:])/))){d.freq='mensal';d.dia=Math.min(31,+m[1])}
 else if(/trimestr/.test(n)){d.freq='trimestral';const q=n.match(/dia (\d{1,2})/);d.dia=q?+q[1]:1}
 else if(/todo mes|mensal|mensalmente|cada mes/.test(n)){d.freq='mensal';const q=n.match(/dia (\d{1,2})\b/);d.dia=q?+q[1]:(/primeiro dia/.test(n)?1:1)}
 else if((m=n.match(/(?:toda|todas as|cada) (segunda|terca|quarta|quinta|sexta|sabado|domingo)/))){d.freq='semanal';d.wd=['domingo','segunda','terca','quarta','quinta','sexta','sabado'].indexOf(m[1])}
 else if(/dias uteis|segunda a sexta/.test(n))d.freq='util';
 else if(/todo dia|todos os dias|diariamente|diario/.test(n))d.freq='diaria';
 else if(/amanha/.test(n)){d.freq='unica';const x=new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate()+1);d.data=isoD(x.getTime())}
 else if((m=n.match(/dia (\d{1,2})\/(\d{1,2})/))){d.freq='unica';d.data=hoje.getFullYear()+'-'+g2(m[2])+'-'+g2(m[1])}
 else if(/\bhoje\b/.test(n)){d.freq='unica';d.data=isoD(hoje.getTime())}
 if((m=n.match(/\b(\d{1,2})\s*(?:h|:)\s*(\d{2})?(?!\w*\/)/))&&+m[1]<24)d.hora=g2(m[1])+':'+g2(m[2]||'00');else if((m=n.match(/\bas (\d{1,2})\b/))&&+m[1]<24)d.hora=g2(m[1])+':00';
 const q=tx.match(/["“]([^"”]+)["”]/);if(q)d.msg=q[1].trim();else if((m=tx.match(/(?:mensagem|dizendo|texto|tarefa|titulo|título)\s*:?\s*(.+)$/i)))d.msg=m[1].trim().replace(/\.$/,'');
 if((m=tx.match(/grupo\s+(?:d[oae]s?\s+)?["“]?([^,.:"”]+?)["”]?(?=\s+(?:a mensagem|mensagem|com|dizendo|todo|toda|todos|às|as|no dia)\b|[,.:]|$)/i)))d.alvo=m[1].trim();
 if(!d.alvo){const c=C.find(x=>n.includes(x.n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')));if(c)d.alvo=c.n}
 if(!d.msg&&tx.includes(':'))d.msg=tx.slice(tx.indexOf(':')+1).trim();
 if(!d.msg&&tx){let c=tx.replace(/\s*(?:às|as|a)\s*\d{1,2}(?:\s*[h:]\s*\d{0,2})?\s*(?:h|horas)?/ig,' ').replace(/^.*?(?=\b(?:marque|marcar|crie|criar|avise|avisar|lembrar|lembre|salvar|salve|mande|enviar|envie|registrar|registre)\b)/i,'').replace(/\b(?:no|na|do|da) (?:google )?(?:calend[aá]rio|agenda|discord|drive|asana|whatsapp)\b/ig,'').replace(/\s+/g,' ').trim();if(c)d.msg=c.charAt(0).toUpperCase()+c.slice(1)}
 d.nome=(d.tool?GTN(d.tool)+' · ':'')+(d.msg||tx).slice(0,42);return d}

 if(g.freq=='unica'){g.done=1;g.nxt=null}else g.nxt=gtNext(g);
 if(auto)toast('Gatilho disparado: '+g.nome);else toast(res);if(!(auto&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))R()}
function gtCopy(id){const g=GAT.find(x=>x.id==id);if(!g)return;try{navigator.clipboard.writeText(g.msg||g.nome).then(()=>toast('Mensagem copiada'),()=>toast('Copie manualmente: '+(g.msg||g.nome)))}catch(e){toast('Copie manualmente: '+(g.msg||g.nome))}}
function gtSent(id){const g=GAT.find(x=>x.id==id);if(g){g.pend=0;g.runs.unshift({at:Date.now(),t:'Você marcou como enviada',auto:false})}R()}
setInterval(()=>{const n=Date.now();GAT.forEach(g=>{if(g.on&&g.nxt&&g.nxt<=n)gtRun(g.id,true)})},15000);

/* ---------- telas ---------- */
function gtRow(g){return`<div class='row' style='display:block'><div style='display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap'><div><b>${hx(g.nome)}</b><small>${GTN(g.tool)} · ${gtWhen(g)}${g.alvo?' · '+hx(g.alvo):''}</small><small>${g.on?(g.nxt?'Próximo disparo: '+gtD(g.nxt):(g.done?'Já disparou':'Só quando você mandar')):'Pausado'}</small></div><div class='fl' style='margin:0'>${g.pend?bd('Aguardando você enviar','wn'):''}${bd(g.on?'Ligado':'Pausado',g.on?'ok':'mt')}</div></div>
<div class='fl' style='margin-top:8px'>${g.pend?`<button class='btn s' onclick='gtCopy(${g.id})'>Copiar mensagem</button><button class='btn s' onclick='gtSent(${g.id})'>Já enviei</button>`:''}<button class='btn s' onclick='gtRun(${g.id})'>Simular disparo agora</button><button class='btn s' onclick='gtToggle(${g.id})'>${g.on?'Pausar':'Ligar'}</button><button class='btn s' onclick='gtEdit(${g.id})'>Editar</button><button class='btn s' onclick='gtDel(${g.id})' aria-label='Excluir ${hx(g.nome)}'>Excluir</button></div>
${g.runs.length?`<small style='display:block;margin-top:6px'><b>Últimos disparos:</b> ${g.runs.slice(0,3).map(r=>gtD(r.at)+' '+hx(r.t)+(r.auto?' (automático)':'')).join(' · ')}</small>`:''}</div>`}
function gtDraft(){const d=GDR;if(!d)return'';const sel=(k,o,v)=>`<select id='gt_${k}' onchange="gtSet('${k}',this.value,${k=='freq'||k=='tool'?1:0})">${o.map(([a,b])=>`<option value='${a}' ${String(v)==String(a)?'selected':''}>${b}</option>`).join('')}</select>`;
 const wl=d.tool=='whatsapp'&&d.alvo&&!WL.chats.some(x=>x.n.toLowerCase()==d.alvo.toLowerCase());
 return`<div id='gtd' class='card' style='margin:10px 0;border-color:var(--ac)'><b>${d.id?'Editar gatilho':'Revise antes de criar'}</b><p style='margin:6px 0'>${gtSay(d)}</p><small>${d.tool?GACT[d.tool]:'Escolha a ferramenta.'}</small>
<div class='fl' style='margin-top:10px'><label>Ferramenta<br>${sel('tool',[['','Escolha'],...GTOOLS],d.tool)}</label><label>Quando<br>${sel('freq',[['manual','Só quando eu mandar'],['diaria','Todo dia'],['util','Dias úteis'],['semanal','Toda semana'],['mensal','Todo mês'],['trimestral','Todo trimestre'],['unica','Uma vez']],d.freq)}</label>
${d.freq=='mensal'||d.freq=='trimestral'?`<label>Dia do mês<br><input type='number' min='1' max='31' value='${d.dia}' style='width:80px' onchange="gtSet('dia',this.value,1)"></label>`:''}${d.freq=='semanal'?`<label>Dia da semana<br>${sel('wd',GWD.map((x,i)=>[i,x]),d.wd)}</label>`:''}${d.freq=='unica'?`<label>Data<br><input type='date' value='${d.data}' onchange="gtSet('data',this.value,1)"></label>`:''}${d.freq!='manual'?`<label>Hora<br><input type='time' value='${d.hora}' onchange="gtSet('hora',this.value,1)"></label>`:''}</div>
<div class='fl' style='margin-top:8px'><label style='flex:1;min-width:200px'>${d.tool=='whatsapp'?'Grupo ou contato (com etiqueta Lumos)':d.tool=='asana'||d.tool=='gcal'?'Cliente (opcional)':'Alvo (opcional)'}<br><input type='text' value='${hx(d.alvo)}' oninput="gtSet('alvo',this.value)" style='width:100%'></label></div>
${wl?`<small class='mu'>Esse grupo ainda não está na lista Lumos (WhatsApp, “Conversas lidas”). Adicione lá para o Claude reconhecer.</small>`:''}
<div class='fl' style='margin-top:8px'><label style='flex:1;min-width:240px'>${d.tool=='whatsapp'||d.tool=='discord'?'Mensagem':'Título ou texto'}<br><textarea rows='2' oninput="gtSet('msg',this.value)" style='width:100%'>${hx(d.msg)}</textarea></label></div>
<div class='fl' style='margin-top:8px'><label style='flex:1;min-width:200px'>Nome do gatilho<br><input type='text' value='${hx(d.nome)}' oninput="gtSet('nome',this.value)" style='width:100%'></label></div>
<div class='fl' style='margin-top:10px'><button class='btn p' onclick='gtCreate()'>${d.id?'Salvar alterações':'Criar gatilho'}</button><button class='btn' onclick='GDR=null;R()'>Descartar</button></div></div>`}
function gtCard(){const L=GAT.filter(g=>GFIL=='all'||g.tool==GFIL);
 return`<div class='card' style='margin-top:14px' id='gtc'><h2>Gatilhos invisíveis</h2><small>Automações que o Claude faz por você, sem você abrir a conversa. Peça em palavras normais, como se estivesse falando comigo. Nesta simulação eles só disparam enquanto o Radar CS estiver aberto; ligados de verdade, rodam sozinhos. No WhatsApp, o Claude prepara a mensagem e te avisa, mas nunca envia por você.</small>
<div class='fl' style='margin-top:10px'><textarea id='gtx' rows='2' placeholder='Ex.: todo dia 1º do mês, mande no grupo Aqua Azul a mensagem “Seu relatório do mês sai hoje”' aria-label='Peça um gatilho' style='flex:1;min-width:240px'></textarea><button class='btn p' onclick='gtAsk()'>Pedir gatilho</button></div>
${gtDraft()}
<div class='tabs' style='flex-wrap:wrap;margin-top:12px'>${[['all','Todos ('+GAT.length+')'],...GTOOLS.map(([k,n])=>[k,n+' ('+GAT.filter(g=>g.tool==k).length+')'])].map(([k,l])=>`<button class='${GFIL==k?'on':''}' onclick="GFIL='${k}';R()">${l}</button>`).join('')}</div>
${L.length?L.map(gtRow).join(''):`<p class='mu' style='margin-top:10px'>Nenhum gatilho ${GFIL=='all'?'ainda':'em '+GTN(GFIL)}. Escreva o pedido acima${GFIL!='all'?` ou <button class='btn s' onclick="gtNew('${GFIL}')">crie um para ${GTN(GFIL)}</button>`:''}.</p>`}</div>`}
const viG=V.integ;V.integ=()=>{const h=viG(),i=h.lastIndexOf("<details class='card dtl'");return i<0?h+gtCard():h.slice(0,i)+gtCard()+h.slice(i)};
function gtBlock(key){const L=GAT.filter(g=>g.tool==key);return`<div style='margin-top:14px;border-top:1px solid var(--ln);padding-top:10px'><b>Gatilhos de ${GTN(key)}</b>${L.length?L.map(g=>`<div class='row'><div><b>${hx(g.nome)}</b><small>${gtWhen(g)} · ${g.on?'Ligado':'Pausado'}</small></div></div>`).join(''):`<p class='mu' style='margin:6px 0'>Nenhum gatilho criado.</p>`}<b style='display:block;margin-top:10px'>Skills detectadas</b><p class='mu' style='margin:6px 0'>Nenhuma skill detectada.</p><div class='fl' style='margin-top:8px'><button class='btn p s' onclick="gtNew('${key}')">＋ Novo gatilho para ${GTN(key)}</button></div></div>`}
const igG=ig;ig=function(k){igG(k);const key=gtKey(IN[k]?IN[k][0]:''),mb=document.getElementById('mb');if(key&&mb)mb.insertAdjacentHTML('beforeend',gtBlock(key))};
const intOG=intOpen;intOpen=function(k){intOG(k);const key={gdrive:'drive',meta:'instagram'}[k]||k,mb=document.getElementById('mb');if(mb&&GTN(key)!='Escolha')mb.insertAdjacentHTML('beforeend',gtBlock(key))};


/* ===== versão zerada: nenhum cliente nem informação de demonstração ===== */
(()=>{[C,T,D,PR,MT,A,TM,HIST,ATA,LINKS,CALV,TLE,APR,WA.msgs,WA.ign,PZ.log,DC.log,DC.people].forEach(a=>a.length=0);
[IG,PF,MK,MMETA,CS7,CX,COV,PRE,S.ev,FGF].forEach(o=>{for(const k in o)delete o[k]});
MG.length=0;S.cnt={fu:0,pr:0,en:0};S.ach={};S.pts=0;DRIVE.pasta='';WA.auto=0;SG.ideas.length=0;ASNn=0})();

/* ===== guardar os dados: db do Claude quando disponível, senão este navegador; mais backup em arquivo ===== */
const PK={C:()=>C,T:()=>T,D:()=>D,PR:()=>PR,A:()=>A,TM:()=>TM,HIST:()=>HIST,ATA:()=>ATA,LINKS:()=>LINKS,CALV:()=>CALV,TLE:()=>TLE,APR:()=>APR,WAm:()=>WA.msgs,REG:()=>REG,MG:()=>MG,IG:()=>IG,PF:()=>PF,MK:()=>MK,MMETA:()=>MMETA,CS7:()=>CS7,CX:()=>CX,COV:()=>COV,PRE:()=>PRE,FGF:()=>FGF,DRIVE:()=>DRIVE,RGT:()=>RGT,WH:()=>WH,WL:()=>WL,INT:()=>INT,MMP:()=>MMP,GAT:()=>GAT,META:{get:()=>({cnt:S.cnt,pts:S.pts,ach:S.ach,ASNn,APid,HIn,ATn,REn,nm:NM}),set:v=>{S.cnt=v.cnt;S.pts=v.pts;S.ach=v.ach;ASNn=v.ASNn;APid=v.APid;HIn=v.HIn;ATn=v.ATn;REn=v.REn;if(v.nm!=null)NM=v.nm}}};
const PKN=Object.keys(PK),STO={mode:'local',db:null,ready:0,last:{},saved:0,err:0};
const pkGet=k=>typeof PK[k]=='function'?PK[k]():PK[k].get(),hyd=(k,v)=>{if(PK[k].set&&typeof PK[k]!='function'){PK[k].set(v);return}const t=PK[k]();if(Array.isArray(t)){t.length=0;t.push(...v)}else{for(const x in t)delete t[x];Object.assign(t,v)}};
function afterHyd(){mtSync();DC.people.length=0;TM.forEach(m=>{const f=m.n.split(' ')[0];DC.people.push({n:f,h:'@'+dnorm(f),on:1})})}
async function stoLoad(){const o={};try{if(window.claude&&claude.use)STO.db=await claude.use('db')}catch(e){STO.db=null}
 if(STO.db){try{const q=await STO.db.collection('estado').get();q.docs.forEach(d=>{const x=d.data();if(x&&typeof x.v=='string')o[d.id]=x.v});STO.mode='db'}catch(e){STO.db=null}}
 if(!STO.db){STO.mode='local';try{PKN.forEach(k=>{const v=localStorage.getItem('radarcs.'+k);if(v)o[k]=v})}catch(e){}}
 return o}
stoLoad().then(o=>{PKN.forEach(k=>{if(o[k]){try{hyd(k,JSON.parse(o[k]))}catch(e){}STO.last[k]=o[k]}});afterHyd();STO.ready=1;R()});
setInterval(async()=>{if(!STO.ready)return;for(const k of PKN){let s;try{s=JSON.stringify(pkGet(k))}catch(e){continue}if(s===STO.last[k])continue;try{if(STO.db)await STO.db.doc('estado/'+k).set({v:s,at:Date.now()});else localStorage.setItem('radarcs.'+k,s);STO.last[k]=s;STO.saved=Date.now();STO.err=0}catch(e){STO.err=1}}},3000);
async function bkExp(){const data=JSON.stringify(Object.fromEntries(PKN.map(k=>[k,pkGet(k)]))),n='radar-cs-backup-'+isoD(Date.now())+'.json';try{const dl=window.claude&&claude.use?await claude.use('downloads'):null;if(dl){await dl.save({filename:n,data});toast('Backup enviado para salvar');return}}catch(e){if(e&&e.code=='declined')return}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=n;document.body.appendChild(a);a.click();a.remove();toast('Backup gerado')}catch(e){toast('Não foi possível gerar o backup')}}
function bkImp(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);let n=0;PKN.forEach(k=>{if(o[k]!=null){hyd(k,o[k]);n++}});afterHyd();toast('Backup restaurado ('+n+' áreas)');R()}catch(e){toast('Arquivo de backup inválido')}};r.readAsText(f)}
function bkResetAsk(){md(`<h2>Apagar tudo e recomeçar?</h2><p>Todos os clientes, reuniões, atas, tarefas e registros serão apagados deste Radar CS. Faça um backup antes se quiser guardar.</p><div class='fl'><button class='btn p' onclick='bkReset()'>Sim, apagar tudo</button><button class='btn' onclick='cm()'>Cancelar</button></div>`)}
function bkReset(){PKN.forEach(k=>{if(PK[k].set&&typeof PK[k]!='function'){PK[k].set({cnt:{fu:0,pr:0,en:0},pts:0,ach:{},ASNn:0,APid:0,HIn:0,ATn:0,REn:0})}else hyd(k,Array.isArray(PK[k]())?[]:{})});DRIVE.pasta='';afterHyd();cm();toast('Radar CS zerado');go('home')}
function bkCard(){const t=STO.saved?new Date(STO.saved).toTimeString().slice(0,5):'';return`<div class='card' style='margin-top:14px'><h2>Seus dados</h2><small>${STO.mode=='db'?'Guardados com segurança na sua conta do Claude. Abrem em qualquer computador.':'Guardados só neste navegador. Faça backups com frequência.'}${t?' Último salvamento às '+t+'.':''}</small>${STO.err?`<p>${bd('Não foi possível salvar agora. Baixe um backup.','bad')}</p>`:''}<div class='fl' style='margin-top:10px'><button class='btn s' onclick='bkExp()'>Baixar backup</button><label class='btn s' style='cursor:pointer'>Restaurar backup<input type='file' accept='.json,application/json' style='display:none' onchange='bkImp(this)'></label><button class='btn s' onclick='bkResetAsk()'>Apagar tudo e recomeçar</button></div></div>`}
const cfgZ=V.config;V.config=()=>cfgZ()+bkCard();

igChk(1);ap();
D.forEach(d=>{d.s0=stOf(d)});
setInterval(()=>{let ch=0;D.forEach(d=>{const s=stOf(d);if(s!=d.s0){if(['atr','crit'].includes(s)&&!['atr','crit'].includes(d.s0))push(d,1);d.s0=s;ch=1}});if(ch&&['entregas','painel','discord'].includes(S.v))return R();document.querySelectorAll('.cd[data-i]').forEach(e=>{const d=D.find(x=>x.id==e.dataset.i);if(d&&!d.done)e.textContent=fmt(d.due-Date.now())})},1000);
R();
</script></body></html>
